name: security-capabilities-lab

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-development-only-change-me-please-rotate}
  APP_ACCESS_TOKEN_MINUTES: ${APP_ACCESS_TOKEN_MINUTES:-30}
  APP_DATABASE_URL: ${APP_DATABASE_URL:-postgresql+psycopg://secops:secops@postgres:5432/secops}
  APP_UPLOAD_DIR: /data/uploads
  APP_MAX_UPLOAD_BYTES: ${APP_MAX_UPLOAD_BYTES:-5242880}
  APP_ALLOWED_UPLOAD_TYPES: ${APP_ALLOWED_UPLOAD_TYPES:-text/plain,application/json,application/pdf}
  APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
  APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-ChangeMe-Now-123!}
  APP_WORKER_POLL_SECONDS: ${APP_WORKER_POLL_SECONDS:-2}
  APP_AUDIT_LOG_PATH: /data/audit/audit.jsonl

services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secops}
      POSTGRES_USER: ${POSTGRES_USER:-secops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secops}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-secops} -d ${POSTGRES_DB:-secops}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [lab]

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      <<: *app-environment
    command: ["python", "-m", "secops_lab.api.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lab]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      <<: *app-environment
      APP_UPLOAD_DIR: /data/uploads
      APP_AUDIT_LOG_PATH: /data/audit/audit.jsonl
    command: ["uvicorn", "secops_lab.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
      - audit:/data/audit
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [lab]

  worker:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      <<: *app-environment
      APP_UPLOAD_DIR: /data/uploads
      APP_AUDIT_LOG_PATH: /data/audit/audit.jsonl
    command: ["python", "-m", "secops_lab.api.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - uploads:/data/uploads
      - audit:/data/audit
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [lab]

  gateway:
    image: nginx:1.27.4-alpine
    user: "101:101"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/cache/nginx:size=32m,mode=1777
      - /var/run:size=8m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    networks: [lab]

  detection-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    working_dir: /workspace
    entrypoint: ["python", "-m", "secops_lab.cli"]
    command: ["detection", "replay", "/workspace/tests/fixtures/detection/ssh_compromise.log", "--output", "/workspace/lab-output/detection-alerts.json"]
    volumes:
      - ./:/workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    networks: [lab]

  triage-demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    working_dir: /workspace
    entrypoint: ["python", "-m", "secops_lab.cli"]
    command:
      - triage
      - run
      - /workspace/tests/fixtures/pip_audit/pip-audit.json
      - /workspace/tests/fixtures/trivy/trivy.json
      - /workspace/tests/fixtures/grype/grype.json
      - /workspace/tests/fixtures/checkov/checkov.json
      - --output-dir
      - /workspace/lab-output/triage
    volumes:
      - ./:/workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    networks: [lab]

  wazuh-logtest:
    profiles: ["wazuh"]
    image: wazuh/wazuh-manager:4.14.6
    entrypoint: ["/bin/bash", "/lab/run_logtest.sh"]
    volumes:
      - ./docker/wazuh/run_logtest.sh:/lab/run_logtest.sh:ro
      - ./detections/linux/ssh/ssh-bruteforce-followed-by-success/implementation/wazuh/local_decoder.xml:/var/ossec/etc/decoders/local_decoder.xml:ro
      - ./detections/linux/ssh/ssh-bruteforce-followed-by-success/implementation/wazuh/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./tests/fixtures/detection:/lab/fixtures:ro
      - ./lab-output:/lab/output
    networks: [lab]

  terraform:
    profiles: ["terraform"]
    image: hashicorp/terraform:1.12.2
    working_dir: /workspace/terraform/aws-foundation
    entrypoint: ["/bin/sh", "-lc"]
    environment:
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      TF_VAR_project_name: ${TF_VAR_project_name:-security-capabilities-lab}
      TF_VAR_environment: ${TF_VAR_environment:-lab}
    volumes:
      - ./:/workspace

volumes:
  postgres-data:
  uploads:
  audit:

networks:
  lab:
    driver: bridge
    internal: false
