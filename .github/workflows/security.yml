name: Security

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  python-security:
    name: Python Security
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: |
          pip install -e ".[dev]"

      - name: Display resolved versions
        run: |
          python - <<'PY'
          import fastapi
          import starlette

          print(f"FastAPI   : {fastapi.__version__}")
          print(f"Starlette : {starlette.__version__}")
          PY

      - name: Dependency tree
        run: |
          pip install pipdeptree
          pipdeptree -p fastapi

      - name: Audit runtime dependencies
        run: |
          pip-audit \
            --format markdown \
            --desc \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln CVE-2026-48817 \
            --ignore-vuln CVE-2026-48818

      - name: Bandit
        run: |
          bandit -q -r src

  trivy:
    name: Trivy
    runs-on: ubuntu-latest
  
    steps:
      - uses: actions/checkout@v7
  
      # Human-readable output in CI logs
      - name: Trivy console scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  
      # SARIF for GitHub Security tab
      - name: Trivy SARIF
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF
        if: >
          always() &&
          (
            github.event_name == 'push' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif


  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
