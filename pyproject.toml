[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-capabilities-lab"
version = "1.0.0"
description = "Executable detection engineering, security automation, AWS security and secure-SDLC labs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Apache-2.0"}
authors = [{name = "Nishanth Konsultancy"}]
dependencies = [
  "alembic==1.18.4",
  "argon2-cffi==25.1.0",
  "defusedxml==0.7.1",
  "email-validator==2.3.0",
  "fastapi==0.128.2",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.13",
  "pydantic==2.13.4",
  "PyJWT==2.13.0",
  "python-multipart==0.0.29",
  "PyYAML==6.0.3",
  "SQLAlchemy==2.0.50",
  "typer==0.26.3",
  "uvicorn[standard]==0.48.0"
]

[project.optional-dependencies]
dev = [
  "bandit==1.9.2",
  "mypy==1.19.1",
  "pip-audit==2.10.0",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.14"
]

[project.scripts]
secops-lab = "secops_lab.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
markers = [
  "integration: tests that start application components or require Docker",
  "aws: tests for AWS/Terraform assets",
  "wazuh: tests for Wazuh assets"
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["secops_lab"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.ruff.lint.per-file-ignores]
"src/secops_lab/api/routers/*.py" = ["B008"]
"src/secops_lab/detection/cli.py" = ["B008"]
"src/secops_lab/triage/cli.py" = ["B008"]
"tests/*.py" = ["S108"]
"tests/**/*.py" = ["S108"]
