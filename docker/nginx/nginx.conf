worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=api_rate:10m rate=20r/s;
  client_max_body_size 6m;

  upstream api_backend { server api:8000; }

  server {
    listen 8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

    location / {
      limit_req zone=api_rate burst=40 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://api_backend;
    }
  }
}
